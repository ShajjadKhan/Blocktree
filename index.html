<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BlockTree - Live Demo</title><script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script><style>body { margin: 0; overflow: hidden; background-color: #0b101e; color: white; font-family: "Courier New", monospace; } #stats-panel { position: fixed; top: 20px; left: 20px; background: rgba(11, 16, 30, 0.8); border: 2px solid #00f3ff; border-radius: 8px; padding: 15px; z-index: 100; box-shadow: 0 0 10px rgba(0, 243, 255, 0.5); backdrop-filter: blur(5px); } .stat-box { margin-bottom: 10px; font-size: 16px; font-weight: bold; color: #a2a2bd; } .stat-value { color: #00f3ff; font-size: 20px; text-shadow: 0 0 5px #00f3ff; } .live-dot { height: 10px; width: 10px; background-color: #ff0055; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #ff0055; animation: blink 1s infinite; margin-right: 5px; } @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } } #canvas-container { width: 100vw; height: 100vh; position: relative; cursor: grab; } #canvas-container:active { cursor: grabbing; } #tree-canvas { width: 4000px; height: 4000px; position: absolute; transform-origin: center center; } .node { width: 150px; padding: 12px; background: #16213e; border: 2px solid #0f3460; border-radius: 8px; position: absolute; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.5); transition: all 0.3s ease; z-index: 10; } .node:hover { transform: scale(1.1); border-color: #00f3ff; box-shadow: 0 0 15px #00f3ff; z-index: 20; } .node img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; border: 2px solid #fff; } .node h3 { margin: 5px 0; font-size: 15px; color: #fff; } .node p { margin: 0; font-size: 12px; color: #a2a2bd; word-wrap: break-word; } .circuit-line { fill: none; stroke: #00f3ff; stroke-width: 3; filter: drop-shadow(0 0 4px rgba(0, 243, 255, 0.8)); stroke-dasharray: 10; animation: dash 20s linear infinite; } @keyframes dash { to { stroke-dashoffset: -1000; } } #add-btn { position: fixed; bottom: 30px; right: 30px; background: #00f3ff; color: #0b101e; border: none; padding: 15px 25px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 0 15px #00f3ff; z-index: 100; transition: 0.3s; } #add-btn:hover { background: #fff; box-shadow: 0 0 25px #fff; transform: scale(1.05); } #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #16213e; padding: 30px; border: 2px solid #00f3ff; border-radius: 10px; z-index: 200; box-shadow: 0 0 20px #00f3ff; width: 300px; } #modal h2 { color: #00f3ff; margin-top: 0; text-align: center; } .input-group { margin-bottom: 15px; } .input-group label { display: block; margin-bottom: 5px; color: #a2a2bd; } .input-group input[type="text"], .input-group input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; background: #0b101e; border: 1px solid #0f3460; color: white; border-radius: 4px; } .btn-group { display: flex; justify-content: space-between; margin-top: 20px; } .btn-group button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; } #submit-btn { background: #00f3ff; color: #0b101e; } #cancel-btn { background: #ff0055; color: white; } #overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 150; }</style></head><body><div id="stats-panel"><div class="stat-box">Total Users: <span class="stat-value" id="total-users">3</span></div><div class="stat-box"><span class="live-dot"></span>Live Visitors: <span class="stat-value" id="live-visitors">12</span></div></div><button id="add-btn">+ Join Grid</button><div id="overlay"></div><div id="modal"><h2>Add Node</h2><div class="input-group"><label>Your Name/Brand:</label><input type="text" id="node-name" placeholder="Enter name"></div><div class="input-group"><label>Short Text/Tagline:</label><input type="text" id="node-text" placeholder="Max 30 chars"></div><div class="input-group"><label>Profile Image:</label><input type="file" id="node-image" accept="image/*"></div><div class="btn-group"><button id="cancel-btn">Cancel</button><button id="submit-btn">Submit Data</button></div></div><div id="canvas-container"><div id="tree-canvas"><svg id="svg-canvas" width="4000" height="4000" style="position:absolute; top:0; left:0; z-index: 1;"><path class="circuit-line" d="M 2000 2000 V 2080 H 1775 V 2150" /><path class="circuit-line" d="M 2000 2000 V 2080 H 2225 V 2150" /></svg><div class="node" style="top: 1900px; left: 1925px; border-color: gold; box-shadow: 0 0 15px gold;"><img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png" alt="Profile"><h3 style="color: gold;">Admin</h3><p>Infinity Grid Core</p></div><div class="node" style="top: 2150px; left: 1700px;"><img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png" alt="Profile"><h3>User 1</h3><p>First connected user.</p></div><div class="node" style="top: 2150px; left: 2150px;"><img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png" alt="Profile"><h3>User 2</h3><p>Second connected user.</p></div></div></div><script>const elem = document.getElementById("tree-canvas"); const panzoom = Panzoom(elem, { maxScale: 3, minScale: 0.3, startScale: 1, contain: "outside" }); elem.parentElement.addEventListener("wheel", panzoom.zoomWithWheel); setTimeout(() => { panzoom.pan(-1400, -1500); }, 100); setInterval(() => { const liveCount = Math.floor(Math.random() * 15) + 20; document.getElementById("live-visitors").innerText = liveCount; }, 3000); let userCount = 3; let rowCount = 0; const addBtn = document.getElementById("add-btn"); const modal = document.getElementById("modal"); const overlay = document.getElementById("overlay"); const cancelBtn = document.getElementById("cancel-btn"); const submitBtn = document.getElementById("submit-btn"); addBtn.onclick = () => { modal.style.display = "block"; overlay.style.display = "block"; }; const closeModal = () => { modal.style.display = "none"; overlay.style.display = "none"; }; cancelBtn.onclick = closeModal; submitBtn.onclick = () => { const name = document.getElementById("node-name").value; const text = document.getElementById("node-text").value; const fileInput = document.getElementById("node-image"); if(!name || !text || !fileInput.files[0]) { alert("Please fill all fields and select an image!"); return; } const reader = new FileReader(); reader.onload = (e) => { userCount++; rowCount++; const topPos = 2400; const leftBase = 1500; const leftSpacing = 225; const leftPos = leftBase + (rowCount * leftSpacing); const newNode = document.createElement("div"); newNode.className = "node"; newNode.style.top = topPos + "px"; newNode.style.left = leftPos + "px"; newNode.innerHTML = "<img src=" + String.fromCharCode(34) + e.target.result + String.fromCharCode(34) + "><h3>" + name + "</h3><p>" + text + "</p>"; const svgCanvas = document.getElementById("svg-canvas"); const newPath = document.createElementNS("http://www.w3.org/2000/svg", "path"); newPath.setAttribute("class", "circuit-line"); const fromX = 1775; const fromY = 2210; const toX = leftPos + 75; const toY = topPos; const d = "M " + fromX + " " + fromY + " V " + (fromY+50) + " H " + toX + " V " + toY; newPath.setAttribute("d", d); svgCanvas.appendChild(newPath); document.getElementById("tree-canvas").appendChild(newNode); document.getElementById("total-users").innerText = userCount; closeModal(); }; reader.readAsDataURL(fileInput.files[0]); };</script></body></html>
